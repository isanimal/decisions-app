<div class="card">
  <h3>Action Menu</h3>
  <div><strong>Decision</strong></div>
  <div class="action-row" style="margin-bottom:6px;">
    {% if role == "ADMIN" %}
      {% if d.archived %}
      <form method="post" action="/decisions/{{ d.id }}/unarchive">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
        <button class="btn success" type="submit">Unarchive</button>
      </form>
      {% else %}
      <form method="post" action="/decisions/{{ d.id }}/archive">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
        <button class="btn warn" type="submit">Archive</button>
      </form>
      {% endif %}
      <form method="post" action="/decisions/{{ d.id }}/delete" style="display:inline;">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
        <label class="muted" style="margin-right:6px;">Type DELETE</label>
        <input class="input-short" type="text" name="confirm" placeholder="DELETE" />
        <button class="btn danger" type="submit">Delete</button>
      </form>
    {% endif %}
  </div>
</div>

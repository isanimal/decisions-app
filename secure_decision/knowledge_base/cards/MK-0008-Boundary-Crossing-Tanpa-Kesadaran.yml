id: "MK-0008"
version: "1.0"
title: "Boundary crossing tanpa kesadaran eksplisit"
decision_pattern: "Data aman karena berasal dari layer sebelumnya."
summary: "Perpindahan konteks data sering mengubah tingkat kepercayaan."

tags:
  assumption: ["trusted_input"]
  boundary: ["api_to_db", "service_to_service"]
  failure_mode: ["fail_silent"]
  control: ["validation", "integrity"]

risk:
  outcomes:
    - "Integrity: data dimanipulasi di boundary"
    - "Injection: parsing berbeda antar layer"
  threat_scenarios:
    - "Data valid di satu layer jadi berbahaya di layer lain"
    - "Assumption trust collapse saat integrasi baru"

mitigation_tiers:
  minimal:
    goal: "Boundary terlihat."
    actions:
      - "Annotasi boundary di code/review"
      - "Re-validate input di boundary kritikal"
  standard:
    goal: "Kontrak antar layer jelas."
    actions:
      - "Schema/DTO eksplisit"
      - "Canonicalization sebelum processing"
  mature:
    goal: "Boundary-aware design."
    actions:
      - "Threat reflection per boundary"
      - "Automated checks untuk kontrak"

tradeoffs:
  effort: "medium"
  complexity: "medium"
  performance: "minimal"
  ux_impact: "minimal"

verification_ideas:
  - "Uji input yang lolos layer A tapi ditolak di layer B"
  - "Pastikan canonicalization konsisten"

anti_patterns:
  - "Validasi sekali lalu dipercaya selamanya"
  - "Boundary tidak terdokumentasi"

references:
  owasp_asvs: ["V5"]
  owasp_samm: ["Design"]
  owasp_wstg: ["WSTG-INPV"]

notes:
  last_updated: "2026-02-06"
  contributors: ["aditya"]
